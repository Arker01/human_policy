# HAT with Future-DINO World Head Configuration
# ================================================
# This configuration adds an auxiliary Future-DINO Head that predicts
# future visual latent features as an auxiliary training signal.
# This can improve the model's understanding of future world states.

common:
  # The number of historical images
  img_history_size: 1
  # The number of future actions to predict
  action_chunk_size: 64
  # The number of cameras to be used in the model
  num_cameras: 2
  # Dimension for state/action, we use the same space for both state and action
  # This MUST be equal to configs/state_vec.py
  state_dim: 128
  action_dim: 128
  camera_names: ['left', 'right']
  policy_class: RDT

dataset:
  # We will extract the data from raw dataset
  # and store them in the disk buffer by producer
  # When training, we will read the data
  # randomly from the buffer by consumer
  # The producer will replace the data which has been
  # read by the consumer with new data

  # The path to the buffer (at least 400GB)
  buf_path: /data/rdt_buffer
  # The number of chunks in the buffer
  buf_num_chunks: 32
  # The number of samples (step rather than episode) in each chunk
  buf_chunk_size: 512

  # We will filter the episodes with length less than `epsd_len_thresh_low`
  epsd_len_thresh_low: 32
  # For those more than `epsd_len_thresh_high`,
  # we will randomly sample `epsd_len_thresh_high` steps each time we load the episode
  # to better balance the training datasets
  epsd_len_thresh_high: 2048
  # How to fit the image size
  image_aspect_ratio: pad
  # Maximum number of language tokens
  tokenizer_max_length: 1024

model:
  # Config for condition adpators
  backbone: SIGLIP
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  lang_token_dim: 4096
  img_token_dim: 1152
  # Dim of action or proprioception vector
  # A `state` refers to an action or a proprioception vector
  state_token_dim: 128
  # Config for RDT structure
  rdt:
    # 1B: num_head 32 hidden_size 2048
    hidden_size: 2048
    depth: 28
    num_heads: 32
    cond_pos_embed_type: multimodal
  # For noise scheduler
  noise_scheduler:
    type: ddpm
    num_train_timesteps: 1000
    num_inference_timesteps: 5
    beta_schedule: squaredcos_cap_v2  # Critical choice
    prediction_type: sample
    clip_sample: False
  # For EMA (params averaging)
  # We do not use EMA currently
  ema:
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

  # Future-DINO World Head Configuration
  # ====================================
  # This is an auxiliary head that predicts future DINO patch features
  # It helps the model learn to predict future world states
  # WARNING: the RDT variant of this head is NOT validated. Its memory is still the
  # pre-trunk image conditioning (`img_cond`), not the RDT block output, so the world
  # gradient does not reach the diffusion trunk and doc S3 is not satisfied. The ACT
  # path (act_with_future_dino.yaml) is the one that was fixed and tested.
  # Disabled by default for that reason -- see HAT_future_DINO_fixes.md.
  future_dino:
    enabled: false
    # Future frame offset H in raw dataset frames (drives the dataloader).
    horizon: 16
    # Weight for the Future-DINO loss (lambda_world in the doc)
    # Recommended to test: 0.1, 0.3, 1.0
    weight: 0.3
    # Number of Transformer Decoder layers
    num_layers: 4
    # Number of attention heads in decoder
    num_heads: 8
    # Dropout rate for decoder
    dropout: 0.1
    # Weight for Huber (Smooth L1) loss component
    # Total loss = cosine_loss + huber_weight * huber_loss
    huber_weight: 0.1
    # Warmup steps for the Future-DINO loss weight
    # The weight linearly increases from 0 to `weight` over these steps
    warmup_steps: 1000

data:
  image_resolution_hw: [240, 320]
