# act_with_future_dino_nostate.yaml 加真实历史观测（t / t-5 / t-10 帧的图像+状态）。
# 唯一差别就是这个 history 段：三帧走同一个 backbone，各加一个可学 per-slot 时间嵌入，
# 三个状态按固定顺序拼进 proprio。评测也要用这一份 —— hist_time_embed 和放大后的
# input_proj_robot_state 都是 ckpt 里的权重，用不带 history 的 yaml 建模型会形状不匹配。
# ab4's config plus the one thing r3_ab4_nostate changes: normalized qpos[98:128]
# (the dex5-only robot-configuration block) is forced to 0 for every embodiment.
# Needed at EVAL time too -- the mask is a checkpoint buffer, so building from
# act_with_future_dino.yaml would drop it and feed the model a state it never saw.
common:
  policy_class: ACT
  state_dim: 128
  action_dim: 128
  camera_names:
  - top
model:
  enc_layers: 4
  dec_layers: 7
  nheads: 8
  hidden_dim: 512
  kl_weight: 10
  dim_feedforward: 3200
  lr_backbone: 1e-5
  backbone: resnet18
  image_feature_strategy: ACT_linear
  use_language_conditioning: false
  future_dino:
    enabled: true
    weight: 0.3
    target_encoder: dinov2_vits14
    horizon: 16
    num_layers: 4
    num_heads: 8
    dropout: 0.1
    num_patches: 1024
    normalize_target: true
    huber_weight: 0.1
    warmup_steps: 0
    ablation: none
  history:
    enabled: true
    # 原始帧偏移，不是秒：两边语料都是 30fps，所以 5/10 帧 = 0.17/0.33s 前，
    # 人机含义一致。当前帧是 slot 0，不列在这里。
    offsets:
    - 5
    - 10
    token_pool: 2
  zero_state_dims: 98:128
data:
  image_resolution_hw:
  - 240
  - 320
