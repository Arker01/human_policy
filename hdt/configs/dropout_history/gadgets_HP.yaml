common: {action_dim: 128, camera_names: [top], policy_class: ACT, state_dim: 128}
data: {image_resolution_hw: [240, 320], action_representation: original}
model:
  backbone: vjepa2_1_vitb
  dec_layers: 7
  dim_feedforward: 3200
  enc_layers: 4
  future_dino: {ablation: none, dropout: 0.1, enabled: true, horizon: 45, huber_weight: 0.1, normalize_target: true, num_heads: 8, num_layers: 4, num_patches: 1024, target_encoder: dinov2_vits14, warmup_steps: 0, weight: 0.0}
  hidden_dim: 512
  image_feature_strategy: ACT_linear
  kl_weight: 10
  lr_backbone: 1.0e-5
  nheads: 8
  use_language_conditioning: false
  zero_state_dims: 98:128
hat_conditioning:
  semantic_dropout: {enabled: false}
  temporal:
    enabled: true
    action_history_enabled: true
    previous_accepted_chunk_enabled: true
    history_samples: 8
    history_span_seconds: 2.0
    plan_anchor_count: 32
    missing_history_probability: 0.10
    missing_plan_probability: 0.20
    min_plan_age_frames: 3
    max_plan_age_frames: 30
    plan_source: teacher_predicted
    teacher_cache: /mnt/nvme0n1/human_policy_ckpt/dropout_history_6way_20261103/teacher_cache/classify_gadgets
    use_accepted_chunk_cursor: true
