common:
  policy_class: ACT_FM
  state_dim: 128
  action_dim: 128
  camera_names: ['top']

model:
  enc_layers: 4          # context TransformerEncoder layers
  fm_layers: 4           # FlowMatchingHead TransformerDecoder layers
  nheads: 8
  hidden_dim: 512
  dim_feedforward: 3200
  lr_backbone: 1e-5
  backbone: resnet18
  image_feature_strategy: ACT_linear
  use_language_conditioning: False
  num_flow_steps: 10     # Euler ODE steps at inference
  hand_eef_weight: 2.0  # 左右手 EEF loss 额外权重
  head_eef_weight: 2.0  # 头部 pos+rot loss 额外权重（0 = 不加权）

data:
  image_resolution_hw: [240, 320]
